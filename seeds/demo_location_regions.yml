seeds:
  - name: demo_location_regions
    description: Demo-only mapping of Jaffle Shop locations to Tableau-style sales regions.
    config:
      schema: null
    columns:

      - name: location_id
        description: Location identifier from the raw stores seed.
        data_tests:
          - not_null
          - unique
      - name: region
        description: Tableau-style geographic region assigned for dashboard demonstrations.
        data_tests:
          - not_null
