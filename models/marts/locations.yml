semantic_models:
  - name: locations
    description: |
      Location dimension table. The grain of the table is one row per location.
    model: ref('locations')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: location
        description: Unique identifier for a Jaffle Shop location.
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        description: Name of the Jaffle Shop location.
        type: categorical
      - name: opened_date
        description: Date the Jaffle Shop location opened.
        expr: opened_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: average_tax_rate
        description: Average tax rate.
        expr: tax_rate
        agg: average
